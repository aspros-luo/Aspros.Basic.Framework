services:
  mysql:
    image: mysql:8.4
    profiles: ["infra"]
    environment:
      MYSQL_DATABASE: aspros_framework_test
      MYSQL_USER: framework
      MYSQL_PASSWORD: framework_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "framework", "-pframework_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - framework-mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - framework-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["infra"]
    environment:
      RABBITMQ_DEFAULT_USER: framework
      RABBITMQ_DEFAULT_PASS: framework_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - framework-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.45.6
    profiles: ["infra"]
    environment:
      CLICKHOUSE_USER: framework
      CLICKHOUSE_PASSWORD: framework_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - framework-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "framework", "--password", "framework_password", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.5.1
    profiles: ["infra"]
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "18848:8848"
      - "19848:9848"
    volumes:
      - framework-nacos-data:/home/nacos/data
    restart: unless-stopped

  framework-core-provider:
    build:
      context: ..
      dockerfile: dev-environment/Dockerfile.api
      args:
        PROJECT_PATH: samples/Framework.Core.Provider/Framework.Core.Provider.csproj
    profiles: ["api"]
    command: ["Framework.Core.Provider.dll"]
    ports:
      - "17041:8080"
      - "7041:7041"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  framework-core-consumer:
    build:
      context: ..
      dockerfile: dev-environment/Dockerfile.api
      args:
        PROJECT_PATH: samples/Framework.Core.Consumer/Framework.Core.Consumer.csproj
    profiles: ["api"]
    command: ["Framework.Core.Consumer.dll"]
    depends_on:
      framework-core-provider:
        condition: service_healthy
    environment:
      Grpc__Provider: "http://framework-core-provider:7041"
    ports:
      - "7141:7141"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7141/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  framework-mysql-data:
  framework-redis-data:
  framework-rabbitmq-data:
  framework-clickhouse-data:
  framework-nacos-data:
