services:
  framework-test:
    build:
      context: ..
      dockerfile: dev-environment/Dockerfile
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__TestDatabase: "Server=mysql;Port=3306;Database=aspros_framework_test;User=framework;Password=framework_password;"
      ConnectionStrings__TestRedis: "redis:6379"
      TestRabbitMq__Host: "rabbitmq"
      TestRabbitMq__Port: "5672"
      TestNacos__Address: "http://nacos:8848"
    command: ["bash", "-lc", "dotnet --info && dotnet restore Aspros.Base.Framework.sln && dotnet ef --version && dotnet test tests/Aspros.Basic.Framework.IntegrationTests/Aspros.Basic.Framework.IntegrationTests.csproj --no-restore"]
    profiles: ["test"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aspros_framework_test
      MYSQL_USER: framework
      MYSQL_PASSWORD: framework_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "framework", "-pframework_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - framework-mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    profiles: ["infra"]

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    profiles: ["infra"]

  nacos:
    image: nacos/nacos-server:v2.5.1
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "18848:8848"
      - "19848:9848"
    profiles: ["infra"]

volumes:
  framework-mysql-data:
