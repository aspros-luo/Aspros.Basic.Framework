name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: framework-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Aspros.Base.Framework.sln

      - name: Build
        run: dotnet build Aspros.Base.Framework.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Aspros.Base.Framework.sln --configuration Release --no-build
